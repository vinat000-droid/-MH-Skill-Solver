<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>MHRSB Skill Solver</title><link rel="stylesheet" href="style.css"></head>
<body><header><small>MONSTER HUNTER RISE: SUNBREAK</small><h1>Skill Solver</h1><p>目標スキルから合法候補を検索</p><div id="loadState" class="loading">データベースを読み込み中…</div></header>
<main>
<section class="card"><h2>目標スキル</h2><div id="skills"></div></section>
<section class="card"><h2>検索設定</h2><label>検索対象<select id="tier"><option value="mr">MR防具（レア8以上）</option><option value="all">全防具</option></select></label><label>最大結果<select id="limit"><option>10</option><option>25</option><option>50</option></select></label><p class="note">防具5部位＋装飾品を探索します。護石・傀異錬成は「必要条件」として表示します。</p></section>
<section class="card actions"><button id="solveBtn" disabled>合法候補を検索</button><button id="resetBtn">リセット</button></section>
<section id="status" class="card hidden"></section><section id="results"></section>
</main><footer>Sunbreak Ver.16.0系データ / ブラウザ版</footer><script src="data/library-loader.js"></script><script src="app.js"></script></body></html>
