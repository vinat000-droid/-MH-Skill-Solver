<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MHRSB Skill Solver</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><h1>MONSTER HUNTER RISE: SUNBREAK</h1><p>Skill Solver FINAL</p><p class="small">GameWith型のスキル選択＋防具・装飾品・護石・傀異錬成条件をまとめて探索</p></header>
<section class="card"><h2>目標スキル</h2><p class="small">選択中のスキルだけを表示します。「＋スキルを追加」から検索して追加してください。</p><div id="skills"></div></section>
<section class="card"><h2>護石</h2><input id="charmName" placeholder="護石名（任意）"><div class="row"><input id="charmSkill1" placeholder="スキル1"><input id="charmLv1" type="number" min="0" value="0"></div><div class="row"><input id="charmSkill2" placeholder="スキル2"><input id="charmLv2" type="number" min="0" value="0"></div><div class="row"><label>スロット <input id="charmS1" type="number" min="0" max="4" value="0"></label><label><input id="charmS2" type="number" min="0" max="4" value="0"></label><label><input id="charmS3" type="number" min="0" max="4" value="0"></label></div><p class="small">手持ち護石を入力すると、その護石を固定して不足分を探索します。</p></section>
<section class="card"><h2>武器・検索設定</h2><label>検索対象 <select id="tier"><option value="mr">MR防具（レア8以上）</option><option value="all">全防具</option></select></label><label class="check"><input id="allowQurious" type="checkbox" checked> 傀異錬成を許容する</label><label>最大結果 <select id="limit"><option>10</option><option>20</option><option>50</option></select></label></section><section class="panel weapon-panel">
  <h2>武器スロット</h2>
  <div class="weapon-slots">
    <label>スロット1
      <select id="weaponSlot1">
        <option value="0">なし</option><option value="1">①</option><option value="2">②</option><option value="3">③</option><option value="4">④</option>
      </select>
    </label>
    <label>スロット2
      <select id="weaponSlot2">
        <option value="0">なし</option><option value="1">①</option><option value="2">②</option><option value="3">③</option><option value="4">④</option>
      </select>
    </label>
    <label>スロット3
      <select id="weaponSlot3">
        <option value="0">なし</option><option value="1">①</option><option value="2">②</option><option value="3">③</option><option value="4">④</option>
      </select>
    </label>
  </div>
</section>
<section class="actions"><button id="solveBtn" disabled>データ読み込み中…</button><button id="saveBtn" class="secondary">設定を保存</button><button id="loadBtn" class="secondary">保存を復元</button><button id="clearSaveBtn" class="secondary">保存を消去</button><button id="resetBtn">リセット</button></section><div id="searchProgress" class="card progress hidden"></div><div id="loadState" class="loading">データベース読み込み中…</div><div id="status" class="card hidden"></div><div id="results"></div><footer>Sunbreak Ver.16.0系データ / ブラウザ版 / RiseSimデータ利用</footer>

</main><script src="data/library-loader.js"></script><script src="app.js"></script></body></html>
