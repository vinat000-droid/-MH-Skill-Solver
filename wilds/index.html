<!doctype html><html lang="ja"><head><meta charset="utf-8"><script src="../common/access-gate.js"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Monster Hunter Wilds Skill Solver</title><link rel="stylesheet" href="../style.css"></head><body><main class="wrap"><header><a href="../" class="back">← GAME SELECT</a><h1>MONSTER HUNTER WILDS</h1><p>Skill Solver</p><p id="dbVersion" class="small">Wilds 日本語DB loading…</p></header><section class="card"><h2>目標スキル</h2><p class="small">スキル名だけでなく、効果の文言からも検索できます。</p><div id="skillPicker" class="skill-picker"></div><div id="selectedSkills"></div></section><section class="card"><h2>護石</h2><p class="small">手持ちの固定護石を入力できます。未指定なら護石なしで検索します。</p><div class="row"><input id="charmSkill" placeholder="スキル名"><input id="charmLv" type="number" min="0" value="0"></div><div class="row"><label>防具スロット <select id="charmA1"><option>0</option><option>1</option><option>2</option><option>3</option></select></label><label>武器スロット <select id="charmW1"><option>0</option><option>1</option></select></label></div></section><section class="card"><h2>武器スロット</h2><div class="weapon-slots"><select id="weaponSlot1"><option value="0">なし</option><option value="1">①</option><option value="2">②</option><option value="3">③</option></select><select id="weaponSlot2"><option value="0">なし</option><option value="1">①</option><option value="2">②</option><option value="3">③</option></select><select id="weaponSlot3"><option value="0">なし</option><option value="1">①</option><option value="2">②</option><option value="3">③</option></select></div></section><section class="actions"><button id="solveBtn" disabled>Wilds DB読み込み中…</button><button id="saveBtn" class="secondary">設定を保存</button><button id="loadBtn" class="secondary">保存を復元</button><button id="clearSaveBtn" class="secondary">保存を消去</button></section><div id="searchProgress" class="card progress hidden"></div><div id="status" class="card hidden"></div><div id="results"></div><footer>Wilds日本語DBはMHDB Wilds APIを利用 / DB更新時は自動反映</footer></main><script src="../common/storage.js"></script><script src="../common/search-ui.js"></script><script src="../common/skill-popover.js"></script><script src="app.js"></script></body></html>
